name: FinGate Linux Bare-Metal, eBPF, Verilator & Moat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-full-stack-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Verilator, Clang/LLVM BPF, Linux headers & Python3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            verilator clang llvm libbpf-dev linux-libc-dev gcc-multilib python3

      - name: Run full Rust test suite (including 0-byte Global Allocator & VOPR gates)
        run: cargo test --offline || cargo test

      - name: Verify C11 & C++17 Polyglot ABI Headers (-Werror)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only include/fingate.h
          c++ -std=c++17 -Wall -Wextra -Werror -x c++ -fsyntax-only include/fingate.h
          python3 sdk/python/fingate_shm.py --self-test

      - name: Compile real Linux XDP Layer-5 eBPF program to BPF ELF bytecode
        run: |
          clang -O2 -g -target bpf -c crates/fingate-xdp-ebpf/c_ref/fingate_xdp_kern.c \
            -o target/fingate_xdp_kern.o
          ls -lh target/fingate_xdp_kern.o

      - name: Run Verilator SystemVerilog RTL Simulation + 10,000-Vector Equivalence
        run: bash hw/fpga_gatekeeper/build_and_sim.sh

      - name: Build & Execute Master Release Benchmarks (Singularity + Frontier + Horizon + Moat + Gap Closure)
        run: |
          cargo build --release --bin fingate_singularity_gate --bin fingate_horizon_bench --bin fingate_frontier_bench --bin fingate_moat_gate --bin fingate_gap_closure --bin fingate_ship_gate --bin fingate_track_c
          ./target/release/fingate_singularity_gate
          ./target/release/fingate_frontier_bench
          ./target/release/fingate_horizon_bench
          ./target/release/fingate_moat_gate --offline
          ./target/release/fingate_gap_closure
          ./target/release/fingate_ship_gate
          ./target/release/fingate_track_c
