[package]
name = "traffic_gateway"
version = "0.1.0"
edition = "2021"

[features]
default = []
dpdk = []
efvi = []
io_uring = []
nitro-enclave = []

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
serde_json = "1"
hdrhistogram = "7.5"
rand = "0.8"
crc32fast = "1.4"
socket2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
